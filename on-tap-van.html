
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ôn tập các bài văn | Nhặt Nhạnh Văn Chương</title>
    <link href="style.css" rel="stylesheet"/>
    <style>
        .page-content { max-width: 1000px; margin: 50px auto; padding: 24px; color: #52634b; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #58734f; text-decoration: none; }
        .page-heading { background: #f4e2e4; border-radius: 24px; padding: 36px 24px; margin-bottom: 30px; }
        
        /* Giao diện nút chọn mục nhỏ NLVH / NLXH */
        .sub-category-bar { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .sub-btn { padding: 10px 20px; background: #fffdf7; border: 1px solid #e9e2d5; border-radius: 20px; color: #52634b; text-decoration: none; font-weight: bold; font-family: 'Quicksand', sans-serif; transition: 0.2s; cursor: pointer; }
        .sub-btn:hover, .sub-btn.active { background: #58734f; color: white; border-color: #58734f; }

        @media (max-width: 600px) {
            .page-content { margin: 20px auto; padding: 16px; }
        }
    </style>
</head>
<body>
<main class="page-content">
    <a class="back-link" href="index.html">← Về trang chủ</a>
    
    <header class="page-heading">
        <p>GÓC LUYỆN VIẾT</p>
        <h1>Ôn tập các bài văn</h1>
        <p>Viết không chỉ để trả lời một đề bài, mà còn để tìm ra tiếng nói và suy nghĩ của chính mình.</p>
    </header>

    <!-- NÚT CHỌN 2 MỤC NHỎ -->
    <div class="sub-category-bar">
        <button class="sub-btn active" onclick="filterSubCategory('Ôn tập văn', this)">Tất cả Ôn tập</button>
        <button class="sub-btn" onclick="filterSubCategory('Ôn tập văn - Nghị luận văn học', this)">📚 Nghị luận văn học</button>
        <button class="sub-btn" onclick="filterSubCategory('Ôn tập văn - Nghị luận xã hội', this)">💡 Nghị luận xã hội</button>
    </div>

    <!-- KHU VỰC HIỂN THỊ BÀI VIẾT -->
    <section class="nnvc-community nnvc-category-feed" data-category="Ôn tập văn">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0;">Bài viết</h2>
            <a href="cong-dong.html" style="background: #7A9B76; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold;">＋ Viết bài mới</a>
        </div>
        <div aria-live="polite" class="nnvc-posts">Đang tải bài viết...</div>
    </section>

    <footer style="padding: 40px 0; text-align: center;">
        Gom nhặt con chữ — vun đầy tâm hồn.
    </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="posts.js"></script>
<script>
    // Hàm bấm vào nút chuyển mục nhỏ
    function filterSubCategory(catName, btnElement) {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        
        const feedSection = document.querySelector('.nnvc-category-feed');
        if(feedSection) {
            feedSection.setAttribute('data-category', catName);
            if(typeof loadCategory === 'function') {
                loadCategory(); // Gọi lại hàm tải bài viết trong posts.js
            }
        }
    }
</script>
</body>
</html>
