<link href="style.css" rel="stylesheet"/>
<style>
        .page-content {
            max-width: 1000px;
            margin: 50px auto;
            padding: 24px;
            color: #52634b;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: #58734f;
            text-decoration: none;
        }

        .page-heading {
            background: #f4e2e4;
            border-radius: 24px;
            padding: 36px 24px;
            margin-bottom: 30px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .topic-card {
            display: block;
            padding: 24px;
            background: #fffdf7;
            border: 1px solid #e9e2d5;
            border-radius: 20px;
            color: #52634b;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px #536b4918;
        }

        .topic-card h2 {
            font-size: 1.2rem;
            margin-top: 0;
        }

        .topic-card p {
            color: #81776c;
            line-height: 1.7;
        }

        .note {
            margin-top: 30px;
            padding: 22px;
            background: #e5eddf;
            border-radius: 18px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .page-content {
                margin: 20px auto;
                padding: 16px;
            }
        }
    </style>
</head>
