
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị | Nhặt Nhạnh Văn Chương</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f6f3e9; color: #344735;
    }
    main {
      max-width: 760px; margin: 30px auto;
      padding: 26px; background: #fffdf7;
      border-radius: 20px;
      box-shadow: 0 5px 25px #34473512;
    }
    h1 { color: #607a5a; }
    input, textarea, button {
      width: 100%; padding: 13px; margin: 8px 0;
      border: 1px solid #d9dfd1; border-radius: 10px;
      font: inherit;
    }
    textarea { min-height: 260px; resize: vertical; }
    button {
      background: #71896a; color: white;
      border: 0; cursor: pointer;
    }
    button.secondary { background: #eadde0; color: #654d52; }
    #editor { display: none; }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Nhặt Nhạnh Văn Chương</h1>
  <p>Khu vực quản trị bài viết</p>

  <section id="login">
    <h2>Quản trị viên đăng nhập</h2>
    <input id="email" type="email" placeholder="Email quản trị">
    <input id="password" type="password" placeholder="Mật khẩu">
    <button id="loginBtn">Đăng nhập</button>
  </section>

  <section id="editor">
    <h2>Viết bài mới</h2>
    <input id="title" placeholder="Tiêu đề bài viết">
    <textarea id="content"
      placeholder="Viết nội dung bài ở đây..."></textarea>
    <button id="draftBtn" class="secondary">Lưu bản nháp</button>
    <button id="publishBtn">Đăng bài cho mọi người đọc</button>
    <button id="logoutBtn" class="secondary">Đăng xuất</button>
  </section>

  <p id="message"></p>
</main>

<script>
  // Thay bằng thông tin dự án của mày trong Supabase.
 const SUPABASE_URL = "https://bxpdmuktqffswadxrwhi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ZoC-0hkpo8pdHGM66pxAHA_T02x1xh7";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const message = text => $("message").textContent = text;

  async function checkSession() {
    const { data } = await db.auth.getSession();
    const session = data.session;
    $("login").style.display = session ? "none" : "block";
    $("editor").style.display = session ? "block" : "none";
  }

  $("loginBtn").onclick = async () => {
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) return message("Đăng nhập lỗi: " + error.message);
    message("Đăng nhập thành công!");
    await checkSession();
  };

  async function savePost(published) {
    const { data: auth } = await db.auth.getUser();
    if (!auth.user) return message("Mày cần đăng nhập lại.");

    const title = $("title").value.trim();
    const content = $("content").value.trim();

    if (!title || !content) {
      return message("Nhập đủ tiêu đề và nội dung nhé!");
    }

    const { error } = await db.from("posts").insert({
      title,
      content,
      published
    });

    if (error) return message("Chưa lưu được: " + error.message);

    message(published ? "Đăng bài thành công!" : "Đã lưu bản nháp!");
    $("title").value = "";
    $("content").value = "";
  }

  $("draftBtn").onclick = () => savePost(false);
  $("publishBtn").onclick = () => savePost(true);

  $("logoutBtn").onclick = async () => {
    await db.auth.signOut();
    await checkSession();
    message("Đã đăng xuất.");
  };

  checkSession();
</script>
</body>
</html>
