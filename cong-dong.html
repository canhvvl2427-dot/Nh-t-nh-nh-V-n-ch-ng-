
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cộng đồng văn học | Nhặt Nhạnh Văn Chương</title>

  <!-- Phông chữ -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Thư viện Supabase bắt buộc phải có -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background: #F9F7F1; font-family: 'Nunito', sans-serif; color: #555A4F; margin: 0; }
    header { background: white; border-bottom: 1px solid #E8E5D8; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
    h1, h2, label, button, select, input { font-family: 'Quicksand', sans-serif; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 16px; }
    .form-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(122,155,118,0.08); margin-bottom: 40px; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 20px; border: 1px solid #E8E5D8; border-radius: 12px; background: #FAFAFA; font-family: 'Nunito', sans-serif; font-size: 15px; box-sizing: border-box; }
    textarea { min-height: 150px; resize: vertical; }
    button[type="submit"] { background: #7A9B76; color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; }
    button[type="submit"]:hover { background: #6A8A66; }
    .success { color: #7A9B76; font-weight: bold; }
    .error { color: #E29595; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div style="max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center;">
      <strong style="color: #7A9B76; font-size: 18px;">🌿 Nhặt Nhạnh Văn Chương</strong>
      <a href="index.html" style="color: #7A9B76; text-decoration: none; font-weight: bold;">Về trang chủ ↗</a>
    </div>
  </header>

  <div class="container">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 style="color: #7A9B76; font-size: 32px; margin-bottom: 10px;">Góc nhỏ văn chương 🌷</h1>
      <p style="color: #959C8D;">Nơi chậm rãi học, dịu dàng viết và sâu sắc cảm nhận.</p>
    </div>

    <!-- KHU VỰC FORM ĐĂNG BÀI (ĐÃ CÓ NLXH & NLVH) -->
    <section class="form-box">
      <h2 style="color: #7A9B76; margin-top: 0;">✍️ Chia sẻ bài viết</h2>
      
      <form id="postForm">
        <label style="font-weight: bold;">Tên hiển thị</label>
        <input id="author" maxlength="60" placeholder="Ví dụ: Một người yêu văn" required>

        <label style="font-weight: bold;">Tiêu đề bài viết</label>
        <input id="title" maxlength="200" placeholder="Nhập tiêu đề..." required>

        <label style="font-weight: bold;">Chọn chuyên mục</label>
        <select id="category" required>
          <option value="Đọc hiểu">Đọc hiểu</option>
          
          <optgroup label="📚 Ôn tập văn">
            <option value="Ôn tập văn - Nghị luận văn học">Nghị luận văn học (Ôn tập)</option>
            <option value="Ôn tập văn - Nghị luận xã hội">Nghị luận xã hội (Ôn tập)</option>
          </optgroup>
          
          <optgroup label="📝 Văn mẫu">
            <option value="Văn mẫu - Nghị luận văn học">Nghị luận văn học (Văn mẫu)</option>
            <option value="Văn mẫu - Nghị luận xã hội">Nghị luận xã hội (Văn mẫu)</option>
          </optgroup>
          
          <option value="Diễn đạt">Diễn đạt</option>
          <option value="Tác phẩm">Tác phẩm</option>
        </select>

        <label style="font-weight: bold;">Nội dung bài viết</label>
        <textarea id="content" maxlength="20000" placeholder="Viết điều bạn muốn chia sẻ..." required></textarea>

        <button id="submitBtn" type="submit">Đăng bài công khai</button>
      </form>
      <p id="message" style="margin-top: 15px; text-align: center;"></p>
    </section>

    <!-- KHU VỰC HIỂN THỊ & LỌC BÀI -->
    <section>
      <select id="filter" style="width: auto; margin-bottom: 20px; font-weight: bold; color: #7A9B76;">
        <option value="">Tất cả bài viết</option>
        <option value="Đọc hiểu">Đọc hiểu</option>
        
        <option value="Ôn tập văn">-- Tất cả Ôn tập văn --</option>
        <option value="Ôn tập văn - Nghị luận văn học">&nbsp;&nbsp;&nbsp;↳ Nghị luận văn học</option>
        <option value="Ôn tập văn - Nghị luận xã hội">&nbsp;&nbsp;&nbsp;↳ Nghị luận xã hội</option>
        
        <option value="Văn mẫu">-- Tất cả Văn mẫu --</option>
        <option value="Văn mẫu - Nghị luận văn học">&nbsp;&nbsp;&nbsp;↳ Nghị luận văn học</option>
        <option value="Văn mẫu - Nghị luận xã hội">&nbsp;&nbsp;&nbsp;↳ Nghị luận xã hội</option>
        
        <option value="Diễn đạt">Diễn đạt</option>
        <option value="Tác phẩm">Tác phẩm</option>
      </select>

      <p id="loading" style="color: #959C8D; font-style: italic;">Đang tải những trang văn...</p>
      
      <!-- posts.js sẽ nhét bài viết vào đây -->
      <div id="posts" class="nnvc-posts"></div> 
    </section>
  </div>

  <!-- NỐI VỚI FILE POSTS.JS -->
  <script src="posts.js"></script>
</body>
<!-- THANH HEADER CỐ ĐỊNH LUÔN HIỆN Ở GÓC TRÁI -->
<header class="nnvc-global-header">
  <a href="index.html" class="nnvc-brand-logo">
    <span class="icon">📖</span>
    <span>Nhặt Nhạnh Văn Chương</span>
  </a>
  <!-- Nếu mày có các nút menu phụ bên phải thì nhét vào đây, không thì thôi -->
</header>

</html>
